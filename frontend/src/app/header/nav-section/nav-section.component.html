<nav class="header-nav">
  @for (item of navItems; track item.link) {
    <pt-button
      [type]="ButtonType.Subtle"
      [routerLink]="[item.link]"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: false}">
      <span class="nav-label">{{ item.label }}</span>
    </pt-button>
  }
</nav>
