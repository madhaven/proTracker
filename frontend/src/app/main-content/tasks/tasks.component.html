<div class="animate-in">
  <div class="add-task-trigger" (click)="openDialog()">
    <span class="plus-icon">+</span>
    <span class="trigger-text">Add a new task...</span>
  </div>
  
  <pt-task-list [tasks]="tasks()" />

  @if (showDialog()) {
    <pt-task-dialog (close)="closeDialog()" />
  }
</div>
