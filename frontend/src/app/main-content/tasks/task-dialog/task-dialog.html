<pt-modal (close)="onCancel()">
  <form [formGroup]="taskForm" (ngSubmit)="addTask()" class="minimal-form">
    <div class="input-container">
      <input #titleInput type="text" formControlName="title" placeholder="What needs to be done?" class="title-input" autocomplete="off">
    </div>
    
    <div class="metadata-row">
      <div class="metadata-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <select formControlName="goalId" class="minimal-select">
          <option value="">Inbox</option>
          @for (goal of goals(); track goal.id) {
            <option [value]="goal.id">{{ goal.title }}</option>
          }
        </select>
      </div>
      
      <div class="metadata-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <input type="date" formControlName="date" class="minimal-date">
      </div>
    </div>

    <div class="dialog-actions">
      <pt-button [type]="ButtonType.Subtle" nativeType="button" (click)="onCancel()" (keypress)="onCancel()">Cancel</pt-button>
      <pt-button [type]="ButtonType.Primary" nativeType="submit" [disabled]="taskForm.invalid">Save Task</pt-button>
    </div>
  </form>
</pt-modal>
