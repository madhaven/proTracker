<div>
  <p class="list-section-header">{{ currentDate | date:'fullDate' }}</p>

  <div class="tasks-list">
    @for (task of pendingTasks(); track task.id) {
      <pt-task-item [task]="task" />
    }
    @if (pendingTasks().length === 0) {
      <p class="empty-text">No tasks left for today.</p>
    }
  </div>
</div>
