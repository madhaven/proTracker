<div class="animate-in">
  <div class="add-goal-trigger" (click)="openDialog()">
    <span class="plus-icon">+</span>
    <span class="trigger-text">Add a new goal...</span>
  </div>

  <!-- Goals List -->
  <div class="goals-container">
    @for (goal of sortedGoals(); track goal.id) {
      @let stats = getGoalStats(goal.id);
      <pt-goal-card
        [goal]="goal"
        [stats]="stats"
        (delete)="deleteGoal(goal.id)" />
    }
    @if (sortedGoals().length === 0) {
      <p class="empty-text">No large objectives set.</p>
    }
  </div>

  @if (showDialog()) {
    <pt-goal-dialog (close)="closeDialog()" />
  }
</div>
